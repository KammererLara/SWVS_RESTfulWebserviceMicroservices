<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Location ID</th>
      <th>Type ID</th>
      <th>Active</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let sensor of sensors">
      <td>{{ sensor.name }}</td>
      <td>{{ sensor.location.id }}</td>
      <td>{{ sensor.type.id }}</td>
      <td>{{ sensor.active }}</td>
    </tr>
  </tbody>
</table>
