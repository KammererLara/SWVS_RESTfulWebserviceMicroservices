<table>
  <thead>
    <h1>Sensor Management</h1>
    <tr>
      <th>Name</th>
      <th>Location Name</th>
      <th>Type Name</th>
      <th>Active</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let sensor of sensors">
      <td>{{ sensor.name }}</td>
      <td>{{ sensor.location.name }}</td>
      <td>{{ sensor.type.name }}</td>
      <td>{{ sensor.location.active ? 'inactive' : 'active' }}</td>

    </tr>
  </tbody>
</table>
