<table>
  <thead>
    <tr>
      <th>Sensor ID</th>
      <th>Timestamp</th>
      <th>Temperature</th>
      <th>Humidity</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let measurement of measurements">
      <td>{{ measurement.sensor.id }}</td>
      <td>{{ measurement.timestamp }}</td>
      <td>{{ measurement.temperature }}</td>
      <td>{{ measurement.humidity }}</td>
    </tr>
  </tbody>
</table>
